
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קופת החיסכון שלי</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f4f5f7;
  color: #202431;
  font-family: Arial, sans-serif;
}

main {
  max-width: 600px;
  margin: auto;
}

h1 {
  font-size: 25px;
  margin-bottom: 5px;
}

.subtitle {
  color: #737987;
  font-size: 14px;
  margin-bottom: 20px;
}

.card {
  background: white;
  border: 1px solid #e7e9ee;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 15px;
}

h2 {
  font-size: 18px;
  margin-top: 0;
}

.balance {
  font-size: 38px;
  font-weight: bold;
  margin: 12px 0;
}

.summary {
  font-size: 13px;
  color: #737987;
  line-height: 1.7;
}

label {
  display: block;
  font-size: 14px;
  margin: 12px 0 6px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 13px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.add-btn {
  width: 100%;
  margin-top: 15px;
  background: #3949ab;
  color: white;
}

.copy-btn {
  width: 100%;
  background: #eef0f7;
  color: #303b82;
}

.purchase {
  border: 1px solid #e7e9ee;
  border-radius: 11px;
  padding: 14px;
  margin-top: 10px;
}

.purchase-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.product-name {
  font-weight: bold;
  font-size: 16px;
  overflow-wrap: anywhere;
}

.product-price {
  color: #c2414b;
  font-weight: bold;
  white-space: nowrap;
}

.purchase-date {
  color: #737987;
  font-size: 12px;
  margin-top: 10px;
}

.empty {
  text-align: center;
  color: #737987;
  padding: 20px;
  font-size: 14px;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #202431;
  color: white;
  padding: 12px 18px;
  border-radius: 9px;
  opacity: 0;
  transition: 0.2s;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
}
</style>
</head>

<body>

<main>

<h1>קופת החיסכון שלי</h1>
<div class="subtitle">
60 שקלים נכנסים לקופה בכל יום
</div>

<!-- מצב הקופה -->
<section class="card">

<h2>היתרה בקופה</h2>

<div class="balance" id="balance">₪0</div>

<div class="summary" id="summary"></div>

</section>

<!-- הוספת קנייה -->
<section class="card">

<h2>הוספת קנייה</h2>

<label for="product">שם המוצר</label>
<input
  id="product"
  type="text"
  placeholder="לדוגמה: אוזניות"
>

<label for="price">מחיר המוצר</label>
<input
  id="price"
  type="number"
  min="0.01"
  step="0.01"
  placeholder="מחיר בשקלים"
>

<button class="add-btn" onclick="addPurchase()">
הוסף קנייה
</button>

</section>
<section class="card">

<h2>גיבוי נתונים</h2>

<button class="copy-btn" onclick="copyData()">
העתק את כל הנתונים
</button>

</section>

<!-- רשימת קניות -->
<section class="card">

<h2>היסטוריית קניות</h2>

<div id="purchases"></div>

</section>

<!-- העתקת נתונים -->

</main>

<div class="toast" id="toast"></div>

<script>

// הגדרות
const DAILY_AMOUNT = 60;
const STORAGE_KEY = "mySavingsPot";

// תאריך היום
function getToday() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

// טעינת נתונים
let data = JSON.parse(
  localStorage.getItem(STORAGE_KEY)
);

if (!data || !data.startDate || !Array.isArray(data.purchases)) {

  data = {
    startDate: getToday(),
    purchases: []
  };

  saveData();
}

// שמירה
function saveData() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

// חישוב ימים
function getDays() {

  const start = new Date(data.startDate + "T00:00:00");
  const now = new Date();

  const today = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  return Math.max(
    1,
    Math.floor((today - start) / 86400000) + 1
  );
}

// סך ההפקדות
function getDeposits() {
  return getDays() * DAILY_AMOUNT;
}

// סך הקניות
function getSpent() {

  return data.purchases.reduce(
    (sum, item) => sum + item.price,
    0
  );

}

// יתרה
function getBalance() {
  return getDeposits() - getSpent();
}

// הצגת כסף
function money(value) {
  return value.toLocaleString("he-IL", {
    style: "currency",
    currency: "ILS"
  });
}

// הצגת תאריך ושעה
function formatDate(date) {

  return new Date(date).toLocaleString("he-IL", {
    dateStyle: "short",
    timeStyle: "medium"
  });

}

// הצגת כל הנתונים
function render() {

  const days = getDays();
  const deposits = getDeposits();
  const spent = getSpent();
  const balance = getBalance();

  document.getElementById("balance").textContent =
    money(balance);

  document.getElementById("summary").textContent =
    days + " ימי חיסכון × 60 ₪ = " +
    money(deposits) +
    " | סך הקניות: " +
    money(spent);

  const container =
    document.getElementById("purchases");

  container.innerHTML = "";

  if (data.purchases.length === 0) {

    container.innerHTML =
      '<div class="empty">עדיין אין קניות</div>';

    return;
  }

  // החדשות ביותר למעלה
  [...data.purchases].reverse().forEach(item => {

    const box = document.createElement("div");
    box.className = "purchase";

    const top = document.createElement("div");
    top.className = "purchase-top";

    const name = document.createElement("div");
    name.className = "product-name";
    name.textContent = item.name;

    const price = document.createElement("div");
    price.className = "product-price";
    price.textContent = "− " + money(item.price);

    const date = document.createElement("div");
    date.className = "purchase-date";
    date.textContent = formatDate(item.date);

    const balance = document.createElement("div");
balance.className = "purchase-date";
balance.textContent =
  "יתרה לאחר הקנייה: " + money(item.balanceAfter);

top.append(name, price);

box.append(top, balance, date);

container.append(box);

    

  });

}

// הוספת קנייה
function addPurchase() {

  const name =
    document.getElementById("product").value.trim();

  const price =
    Number(document.getElementById("price").value);

  if (!name) {
    showToast("צריך להכניס שם מוצר");
    return;
  }

  if (!Number.isFinite(price) || price <= 0) {
    showToast("צריך להכניס מחיר תקין");
    return;
  }

  

  const purchasePrice = Number(price.toFixed(2));

const balanceAfter = getBalance() - purchasePrice;

data.purchases.push({

  name: name,

  price: purchasePrice,

  balanceAfter: Number(balanceAfter.toFixed(2)),

  date: new Date().toISOString()

});

  saveData();

  document.getElementById("product").value = "";
  document.getElementById("price").value = "";

  render();

  showToast("הקנייה נשמרה בהצלחה");

}

// העתקת כל הנתונים
async function copyData() {

  const backup = {

    startDate: data.startDate,

    dailyDeposit: DAILY_AMOUNT,

    days: getDays(),

    totalDeposits: getDeposits(),

    totalPurchases: getSpent(),

    currentBalance: getBalance(),

    purchases: data.purchases

  };

  const text = JSON.stringify(backup, null, 2);

  try {

    await navigator.clipboard.writeText(text);

    showToast("כל הנתונים הועתקו");

  } catch (error) {

    const textarea = document.createElement("textarea");

    textarea.value = text;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    showToast("הנתונים הועתקו");

  }

}

// הודעה
function showToast(message) {

  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2200);

}

// הפעלה ראשונית
render();

// רענון כשחוזרים לדף
document.addEventListener("visibilitychange", () => {

  if (!document.hidden) {
    render();
  }

});

</script>

</body>
</html>
